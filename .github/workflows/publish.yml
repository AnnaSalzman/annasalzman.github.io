# Builds the site and publishes it to https://annasalzman.github.io.
#
# Runs on every push to main (that includes every edit saved on github.com)
# and can be started by hand from the Actions tab ("Run workflow").
# Pull requests are built as a check but never published.
#
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions". See README.md.

name: Publish site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Runs scripts/check-content.mjs first; its messages show up as
      # annotations at the top of this run's page.
      - run: npm run build

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Several quick saves queue up instead of interrupting a publish halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
